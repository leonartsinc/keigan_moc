<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width" />
        <title>慧眼（egen）｜Assessment tool（管理者）</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/assessment.css" />
        <link rel="stylesheet" href="css/assessment_admin.css" />
        <link rel="icon" href="img/siteicon.png" sizes="192x192" />
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet" />
        <style>
            /* html の overflow を CSS で設定する（JS より先に適用される）。
               目的1: スクロールバーを初期レンダリングから除去し 100vw = 視覚的ビューポート幅 にする。
               目的2: overflow:hidden をここだけに留め、body には付与しない。
                       body にも overflow:hidden があると Chrome 等で position:fixed の
                       含有ブロックが body になり、right:24px が body 右端基準になって画面外に出る。 */
            html {
                overflow: hidden;
            }
            /* section の overflow-x:auto を解除して .l-content-wrapper を唯一の
               スクロールコンテナにする。min-width は JS(initDynamicLayout) で
               人物数に応じて動的に設定する。 */
            body.admin-page section {
                overflow: visible;
            }
        </style>
    </head>
    <body class="admin-page">
        <script src="js/assessment-body-loader.js"></script>
        <script>
          includeAssessmentBody('partials/assessment-body-cluster2.html', {
            '__ASSESSMENT_MODE_TITLE__': 'アセスメント診断　（管理者）'
          });
        </script>
