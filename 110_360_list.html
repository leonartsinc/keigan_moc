<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慧眼（egen）｜360°一覧画面</title>
  <link rel="icon" href="img/siteicon.png" sizes="192x192" />
  <link rel="stylesheet" href="css/topstyle.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/component-v3.css">
  <link rel="stylesheet" href="css/110_360_list.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { overflow-y: auto; height: auto; }
  </style>
</head>
<body class="bg-gray-100">
  <div id="app-header"></div>

  <div id="mainContent" class="pt-14 min-h-screen flex flex-col transition-all duration-300" style="margin-left:78px; width:calc(100% - 80px);">

    <main class="max-w-6xl mx-auto px-4 py-5 flex-1 w-full">

      <!-- Component: ThreeSixtyListBreadcrumb -->
      <div class="site-breadcrumb">
        <span class="is-current" id="tsl-breadcrumb-label">360°一覧</span>
      </div>
      <!-- /Component: ThreeSixtyListBreadcrumb -->

      <!-- Component: ThreeSixtyListTopBar -->
      <div class="tsl-topbar">
        <span class="tsl-topbar-title" id="tsl-topbar-title">個別評価（360°）</span>
      </div>
      <!-- /Component: ThreeSixtyListTopBar -->

      <!-- Component: ThreeSixtyListPanel -->
      <div class="tsl-panel">

        <!-- Component: ThreeSixtyListInfoBar -->
        <div class="tsl-info-bar">
          <span class="tsl-login">ログイン：<span id="tsl-login-name">八木</span></span>
        </div>
        <!-- /Component: ThreeSixtyListInfoBar -->

        <!-- Component: ThreeSixtyListContextForm -->
        <div class="tsl-context-form">
          <table class="tsl-table">
            <tbody>
              <tr>
                <td class="tsl-label">年度</td>
                <td class="tsl-value">
                  <select id="tsl-f-year" class="tsl-sel w-32">
                    <option>2026</option>
                    <option>2025</option>
                  </select>
                </td>
              </tr>
              <tr>
                <td class="tsl-label">部署</td>
                <td class="tsl-value">
                  <select id="tsl-f-dept" class="tsl-sel w-64">
                    <option>デジタルソリューション事業部</option>
                    <option>ITサービス事業部</option>
                  </select>
                </td>
              </tr>
              <tr id="tsl-f-status-row" class="tsl-row-assessment-only" hidden>
                <td class="tsl-label">状態</td>
                <td class="tsl-value">
                  <select id="tsl-f-status" class="tsl-sel w-32" onchange="renderAssessmentList()">
                    <option value="">　</option>
                    <option value="本人済">本人済</option>
                    <option value="未">未</option>
                  </select>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- /Component: ThreeSixtyListContextForm -->

        <!-- Component: ThreeSixtyListTable -->
        <div class="tsl-list-wrap" id="tsl-list-wrap">
          <table class="tsl-list-table">
            <thead>
              <tr>
                <th class="tsl-col-check">
                  <input type="checkbox" id="tsl-check-all" class="accent-orange-500" onchange="toggleAllThreeSixtyChecks(this)">
                </th>
                <th>従業員</th>
                <th>評価日時</th>
              </tr>
            </thead>
            <tbody id="tsl-body"></tbody>
          </table>
        </div>
        <!-- /Component: ThreeSixtyListTable -->

        <!-- Component: AssessmentListTable -->
        <div class="tsl-list-wrap" id="asm-list-wrap" hidden>
          <table class="tsl-list-table">
            <thead>
              <tr>
                <th class="tsl-col-check"></th>
                <th>従業員</th>
                <th>状態</th>
                <th>３６０°</th>
                <th>一次評価</th>
                <th>二次評価</th>
                <th>三次評価</th>
              </tr>
            </thead>
            <tbody id="asm-body"></tbody>
          </table>
        </div>
        <!-- /Component: AssessmentListTable -->

        <!-- Component: ThreeSixtyListActionBar -->
        <div class="tsl-action-bar" id="tsl-action-bar">
          <button type="button" id="tsl-start-btn" class="tsl-btn-primary" disabled onclick="startThreeSixtyEvaluation()">評価を開始する</button>
        </div>
        <!-- /Component: ThreeSixtyListActionBar -->

        <!-- Component: AssessmentListActionBar -->
        <div class="tsl-action-bar" id="asm-action-bar" hidden>
          <button type="button" id="asm-exec-btn" class="tsl-btn-primary" disabled onclick="executeAssessment()">実行する</button>
        </div>
        <!-- /Component: AssessmentListActionBar -->

      </div>
      <!-- /Component: ThreeSixtyListPanel -->

    </main>

    <div id="app-footer"></div>
  </div>

  <script src="js/common.js"></script>
  <script>
    mountHeader('360°一覧画面');
    mountFooter();

    // ========== 表示モード判定（c=1: 個別評価一覧／c=2: 査定の一覧、未指定・不正値はc=1） ==========
    function getThreeSixtyMode() {
      const c = new URLSearchParams(window.location.search).get("c");
      return c === "2" ? "assessment" : "list";
    }

    // ========== モックデータ：360°評価対象の従業員一覧 ==========
    const THREESIXTY_TARGETS = [
      { code: "e01", name: "北村", evaluatedAt: null,                        checked: false },
      { code: "e02", name: "瀬田", evaluatedAt: null,                        checked: false },
      { code: "e03", name: "小林", evaluatedAt: null,                        checked: true  },
      { code: "e04", name: "本田", evaluatedAt: null,                        checked: false },
      { code: "e05", name: "鎌内", evaluatedAt: null,                        checked: false },
      { code: "e06", name: "清水", evaluatedAt: "2026/3/11  17:10:22",       checked: false },
      { code: "e07", name: "吉田", evaluatedAt: null,                        checked: false },
    ];

    // ========== 一覧描画 ==========
    function renderThreeSixtyList() {
      const tbody = document.getElementById("tsl-body");
      tbody.innerHTML = THREESIXTY_TARGETS.map(t => `
        <tr class="${t.checked ? "is-checked" : ""}">
          <td class="tsl-col-check">
            <input type="checkbox" class="accent-orange-500 tsl-row-check" data-code="${t.code}"
                   ${t.checked ? "checked" : ""} onchange="onThreeSixtyRowCheckChange(this)">
          </td>
          <td>${t.name}</td>
          <td class="tsl-col-time">${t.evaluatedAt ? t.evaluatedAt : `<span class="tsl-slot-empty">-</span>`}</td>
        </tr>`).join("");
      syncThreeSixtyCheckAll();
      syncThreeSixtyStartButton();
    }

    // ========== 選択チェックボックス ==========
    function onThreeSixtyRowCheckChange(cb) {
      const code = cb.dataset.code;
      const target = THREESIXTY_TARGETS.find(t => t.code === code);
      if (target) target.checked = cb.checked;
      cb.closest("tr").classList.toggle("is-checked", cb.checked);
      syncThreeSixtyCheckAll();
      syncThreeSixtyStartButton();
    }

    function toggleAllThreeSixtyChecks(masterCb) {
      THREESIXTY_TARGETS.forEach(t => t.checked = masterCb.checked);
      renderThreeSixtyList();
    }

    function syncThreeSixtyCheckAll() {
      const total = THREESIXTY_TARGETS.length;
      const checked = THREESIXTY_TARGETS.filter(t => t.checked).length;
      const masterCb = document.getElementById("tsl-check-all");
      masterCb.indeterminate = checked > 0 && checked < total;
      masterCb.checked = total > 0 && checked === total;
    }

    // ========== 評価開始ボタン ==========
    function syncThreeSixtyStartButton() {
      const checkedCount = THREESIXTY_TARGETS.filter(t => t.checked).length;
      document.getElementById("tsl-start-btn").disabled = checkedCount === 0;
    }

    function startThreeSixtyEvaluation() {
      const checkedCount = THREESIXTY_TARGETS.filter(t => t.checked).length;
      if (checkedCount === 0) return;
      window.open(
        checkedCount === 1 ? "112_360_others_individual.html" : "114_360_others_multi.html",
        "_blank",
        "noopener"
      );
    }

    // ========== モックデータ：査定対象の従業員一覧（c=2） ==========
    const ASSESSMENT_TARGETS = [
      { code: "a01", name: "北村", status: "本人済", raters: "1名", first: "済", second: "未", third: "-", checked: false },
      { code: "a02", name: "高木", status: "未",     raters: null,  first: "未", second: "-",  third: "-", checked: false },
      { code: "a03", name: "遠藤", status: "未",     raters: null,  first: "未", second: "-",  third: "-", checked: false },
      { code: "a04", name: "常木", status: "未",     raters: null,  first: "未", second: "-",  third: "-", checked: false },
      { code: "a05", name: "八木", status: "本人済", raters: null,  first: "済", second: "未", third: "-", checked: false },
      { code: "a06", name: "小林", status: "本人済", raters: "3名", first: "済", second: "済", third: "未", checked: true  },
      { code: "a07", name: "岡田", status: "本人済", raters: null,  first: "済", second: "未", third: "-", checked: false },
      { code: "a08", name: "田中", status: "未",     raters: null,  first: "未", second: "-",  third: "-", checked: false },
    ];

    // ========== 査定一覧描画 ==========
    function renderAssessmentList() {
      const statusFilter = document.getElementById("tsl-f-status").value;
      const tbody = document.getElementById("asm-body");
      const rows = ASSESSMENT_TARGETS.filter(t => !statusFilter || t.status === statusFilter);
      tbody.innerHTML = rows.map(t => `
        <tr class="${t.checked ? "is-checked" : ""}">
          <td class="tsl-col-check">
            <input type="radio" name="asm-select" class="accent-orange-500 asm-row-check" data-code="${t.code}"
                   ${t.checked ? "checked" : ""} onchange="onAssessmentRowCheckChange(this)">
          </td>
          <td>${t.name}</td>
          <td>${t.status}</td>
          <td>${t.raters ? t.raters : ""}</td>
          <td>${t.first}</td>
          <td>${t.second}</td>
          <td>${t.third}</td>
        </tr>`).join("");
      syncAssessmentExecButton();
    }

    // ========== 査定一覧：選択（単一選択） ==========
    function onAssessmentRowCheckChange(cb) {
      const code = cb.dataset.code;
      ASSESSMENT_TARGETS.forEach(t => t.checked = (t.code === code));
      document.querySelectorAll("#asm-body tr").forEach(tr => {
        tr.classList.toggle("is-checked", tr.querySelector(".asm-row-check").dataset.code === code);
      });
      syncAssessmentExecButton();
    }

    // ========== 査定一覧：実行ボタン ==========
    function syncAssessmentExecButton() {
      const checkedCount = ASSESSMENT_TARGETS.filter(t => t.checked).length;
      document.getElementById("asm-exec-btn").disabled = checkedCount === 0;
    }

    function executeAssessment() {
      window.open("115_360_list_approval.html", "_blank", "noopener");
    }

    // ========== 初期化 ==========
    function initThreeSixtyPage() {
      const isAssessment = getThreeSixtyMode() === "assessment";
      document.getElementById("tsl-breadcrumb-label").textContent = isAssessment ? "360°（査定）一覧" : "360°一覧";
      document.getElementById("tsl-topbar-title").textContent = isAssessment ? "360°（査定）一覧" : "個別評価（360°）";
      document.getElementById("tsl-f-status-row").hidden = !isAssessment;
      document.getElementById("tsl-list-wrap").hidden = isAssessment;
      document.getElementById("asm-list-wrap").hidden = !isAssessment;
      document.getElementById("tsl-action-bar").hidden = isAssessment;
      document.getElementById("asm-action-bar").hidden = !isAssessment;

      if (isAssessment) {
        renderAssessmentList();
      } else {
        renderThreeSixtyList();
      }
    }

    initThreeSixtyPage();
  </script>

</body>
</html>
